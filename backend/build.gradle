plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'az.masapay'
version = '0.0.1-SNAPSHOT'
description = 'masapay backend — QR-based real-time bill split and payment platform'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Web / REST
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Persistence
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	// Cache / pub-sub
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// Security
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// Google ID token verification (OAuth2)
	implementation 'com.google.api-client:google-api-client:2.7.0'

	// JWT (access/refresh tokens)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// Real-time
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	// QR code matrix generation for printable table codes (rendered to SVG ourselves)
	implementation 'com.google.zxing:core:3.5.3'

	// Observability (health endpoint)
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// API docs: OpenAPI spec at /v3/api-docs and Swagger UI at /swagger-ui.html (springdoc 2.7.x targets Boot 3.4)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Test. Testcontainers integration tests (#52) need Docker and are skipped without it.
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Test coverage (#52): `./gradlew test` writes build/reports/jacoco/test/html/index.html, and
// `./gradlew check` fails if the critical services drop below 70% line coverage.
jacoco {
	toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.named('test') {
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestCoverageVerification') {
	dependsOn tasks.named('test')
	violationRules {
		rule {
			element = 'PACKAGE'
			includes = ['az.masapay.payment', 'az.masapay.payment.payriff', 'az.masapay.payment.refund',
					'az.masapay.split', 'az.masapay.auth']
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.70
			}
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('jacocoTestCoverageVerification')
}
