# Local stack: PostgreSQL, Redis, backend and frontend (issue #50).
#   docker compose up --build
# Frontend: http://localhost:3000   Backend API: http://localhost:8080
# PostgreSQL is published on host port 5433 (not 5432) so it does not clash
# with a PostgreSQL already installed on the machine.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: masapay
      POSTGRES_USER: masapay
      POSTGRES_PASSWORD: masapay
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masapay -d masapay"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/masapay
      SPRING_DATASOURCE_USERNAME: masapay
      SPRING_DATASOURCE_PASSWORD: masapay
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MASAPAY_GOOGLE_CLIENT_ID: ${MASAPAY_GOOGLE_CLIENT_ID:-}
      # This compose file is for local development, so the public dev JWT and webhook secrets
      # are allowed here. A deployment sets MASAPAY_JWT_SECRET and MASAPAY_PAYRIFF_WEBHOOK_SECRET
      # and leaves this false, otherwise the backend refuses to start.
      MASAPAY_ALLOW_DEV_SECRETS: ${MASAPAY_ALLOW_DEV_SECRETS:-true}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres-data:
