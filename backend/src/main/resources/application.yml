spring:
  application:
    name: masapay-backend

  # Outgoing calls (Payriff, iiko) give up instead of holding a request thread forever when
  # the other side hangs; applies to every RestClient built from the auto-configured builder.
  http:
    client:
      connect-timeout: ${MASAPAY_HTTP_CONNECT_TIMEOUT:5s}
      read-timeout: ${MASAPAY_HTTP_READ_TIMEOUT:20s}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/masapay}
    username: ${SPRING_DATASOURCE_USERNAME:masapay}
    password: ${SPRING_DATASOURCE_PASSWORD:masapay}

  # Errors from ResponseStatusException go out as RFC 7807 problem details, with our short
  # reason in "detail" (e.g. RESTAURANT_CLOSED, #147) for the client to act on. Unexpected
  # exceptions still show no message.
  mvc:
    problemdetails:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Fail fast: a failed or checksum-mismatched migration aborts startup.
    validate-on-migrate: true
    out-of-order: false
    # Never allow `flyway clean` to wipe a database, in any environment.
    clean-disabled: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

masapay:
  redis:
    # Enables the cache manager and pub/sub wiring; disabled in the infra-free smoke test.
    enabled: ${MASAPAY_REDIS_ENABLED:true}
    events-channel: ${MASAPAY_REDIS_EVENTS_CHANNEL:masapay:events}
    # Channel carrying order-update snapshots relayed to WebSocket clients.
    order-channel: ${MASAPAY_REDIS_ORDER_CHANNEL:masapay:order-events}
  auth:
    # Enables the Google authentication endpoint; disabled in the infra-free smoke test.
    enabled: ${MASAPAY_AUTH_ENABLED:true}
    google:
      # Google OAuth2 client id; also the expected ID token audience. Supplied per environment.
      client-id: ${MASAPAY_GOOGLE_CLIENT_ID:}
    # Comma-separated emails bootstrapped as enabled SUPER_ADMINs on login (seeds the first admin).
    super-admin-emails: ${MASAPAY_SUPER_ADMIN_EMAILS:}
    # Send the refresh-token cookie only over HTTPS. Keep true in every deployed environment,
    # false only for plain-http local development.
    cookie-secure: ${MASAPAY_AUTH_COOKIE_SECURE:false}
    dev-login:
      # LOCAL DEVELOPMENT ONLY. Enables POST /api/auth/dev-login, which signs in as an existing
      # enabled user by email without Google. Never set this in a deployed environment.
      enabled: ${MASAPAY_DEV_LOGIN_ENABLED:false}
  security:
    # LOCAL DEVELOPMENT ONLY. Lets the app start with the public default JWT and webhook
    # secrets below. Off by default, so a deployment that forgets to set them fails at startup
    # instead of accepting forged tokens. Dev login implies it.
    allow-dev-secrets: ${MASAPAY_ALLOW_DEV_SECRETS:${MASAPAY_DEV_LOGIN_ENABLED:false}}
  rate-limit:
    # Fixed one-minute (and one-day) windows kept in memory per instance. Behind a reverse
    # proxy also set SERVER_FORWARD_HEADERS_STRATEGY=framework so the client IP is real.
    enabled: ${MASAPAY_RATE_LIMIT_ENABLED:true}
    # Sign-in, refresh and logout, per IP.
    auth-per-minute: ${MASAPAY_RATE_LIMIT_AUTH_PER_MINUTE:20}
    # Customer endpoints reached through a table QR code, per IP.
    public-per-minute: ${MASAPAY_RATE_LIMIT_PUBLIC_PER_MINUTE:120}
    # Starting a payment creates a Payriff order, so it gets its own, tighter limits per IP.
    payment-per-minute: ${MASAPAY_RATE_LIMIT_PAYMENT_PER_MINUTE:10}
    payment-per-day: ${MASAPAY_RATE_LIMIT_PAYMENT_PER_DAY:100}
    # Signed-in staff, per user.
    staff-per-minute: ${MASAPAY_RATE_LIMIT_STAFF_PER_MINUTE:300}
  orders:
    # Enables the customer-facing order endpoints; disabled in the infra-free smoke test.
    enabled: ${MASAPAY_ORDERS_ENABLED:true}
  jwt:
    # HMAC-SHA256 signing secret (>= 32 bytes). Override per environment; never ship the default.
    secret: ${MASAPAY_JWT_SECRET:masapay-dev-secret-change-me-0123456789-abcdefghij}
    issuer: ${MASAPAY_JWT_ISSUER:masapay}
    access-token-ttl: ${MASAPAY_JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${MASAPAY_JWT_REFRESH_TTL:P7D}
  qr:
    # Public origin of the customer PWA; table QR codes encode <base-url>/r/<restaurantId>/t/<tableId>?token=<qrToken>.
    base-url: ${MASAPAY_QR_BASE_URL:http://localhost:5173}
  iiko:
    # iiko Cloud API root; overridden in tests and for the EU region (api-eu.iiko.services).
    base-url: ${MASAPAY_IIKO_BASE_URL:https://api-ru.iiko.services}
  payriff:
    # HMAC-SHA256 key that signs the callback URLs we hand to Payriff (#34). Payriff does not sign
    # its callbacks, so this signature is how a webhook proves it belongs to one of our payments.
    # Override per environment; never ship the default.
    webhook-secret: ${MASAPAY_PAYRIFF_WEBHOOK_SECRET:masapay-dev-webhook-secret-change-me-0123456789}
    # Payriff API root (v3 endpoints, as the official SDKs use) and the merchant app key sent as
    # the Authorization header. Supplied per environment.
    base-url: ${MASAPAY_PAYRIFF_BASE_URL:https://api.payriff.com}
    app-key: ${MASAPAY_PAYRIFF_APP_KEY:}
    # Public URL of our webhook endpoint (#35); Payriff posts the payment result here.
    callback-url: ${MASAPAY_PAYRIFF_CALLBACK_URL:http://localhost:8080/api/public/payriff/webhook}
    # Where Payriff sends the customer back after the payment page.
    redirect-url: ${MASAPAY_PAYRIFF_REDIRECT_URL:http://localhost:5173/payment/result}
    # LOCAL DEVELOPMENT ONLY: approve payments on a mock page instead of Payriff (#37). Never true
    # in a deployed environment.
    mock: ${MASAPAY_PAYRIFF_MOCK:false}
    mock-page-url: ${MASAPAY_PAYRIFF_MOCK_PAGE_URL:http://localhost:5173/payment/mock}

springdoc:
  # OpenAPI spec and Swagger UI for trying the API by hand. Off unless asked for
  # (MASAPAY_API_DOCS_ENABLED=true) or in local dev-login mode, so a deployment does not
  # publish the endpoint map by default.
  api-docs:
    enabled: ${MASAPAY_API_DOCS_ENABLED:${MASAPAY_DEV_LOGIN_ENABLED:false}}
  swagger-ui:
    enabled: ${MASAPAY_API_DOCS_ENABLED:${MASAPAY_DEV_LOGIN_ENABLED:false}}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
