spring:
  application:
    name: masapay-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/masapay}
    username: ${SPRING_DATASOURCE_USERNAME:masapay}
    password: ${SPRING_DATASOURCE_PASSWORD:masapay}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Fail fast: a failed or checksum-mismatched migration aborts startup.
    validate-on-migrate: true
    out-of-order: false
    # Never allow `flyway clean` to wipe a database, in any environment.
    clean-disabled: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

masapay:
  redis:
    # Enables the cache manager and pub/sub wiring; disabled in the infra-free smoke test.
    enabled: ${MASAPAY_REDIS_ENABLED:true}
    events-channel: ${MASAPAY_REDIS_EVENTS_CHANNEL:masapay:events}
    # Channel carrying order-update snapshots relayed to WebSocket clients.
    order-channel: ${MASAPAY_REDIS_ORDER_CHANNEL:masapay:order-events}
  auth:
    # Enables the Google authentication endpoint; disabled in the infra-free smoke test.
    enabled: ${MASAPAY_AUTH_ENABLED:true}
    google:
      # Google OAuth2 client id; also the expected ID token audience. Supplied per environment.
      client-id: ${MASAPAY_GOOGLE_CLIENT_ID:}
    # Comma-separated emails bootstrapped as enabled SUPER_ADMINs on login (seeds the first admin).
    super-admin-emails: ${MASAPAY_SUPER_ADMIN_EMAILS:}
  orders:
    # Enables the customer-facing order endpoints; disabled in the infra-free smoke test.
    enabled: ${MASAPAY_ORDERS_ENABLED:true}
  jwt:
    # HMAC-SHA256 signing secret (>= 32 bytes). Override per environment; never ship the default.
    secret: ${MASAPAY_JWT_SECRET:masapay-dev-secret-change-me-0123456789-abcdefghij}
    issuer: ${MASAPAY_JWT_ISSUER:masapay}
    access-token-ttl: ${MASAPAY_JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${MASAPAY_JWT_REFRESH_TTL:P7D}
  qr:
    # Public origin of the customer PWA; table QR codes encode <base-url>/r/<restaurantId>/t/<tableId>?token=<qrToken>.
    base-url: ${MASAPAY_QR_BASE_URL:http://localhost:5173}
  iiko:
    # iiko Cloud API root; overridden in tests and for the EU region (api-eu.iiko.services).
    base-url: ${MASAPAY_IIKO_BASE_URL:https://api-ru.iiko.services}
  payriff:
    # HMAC-SHA256 key that signs the callback URLs we hand to Payriff (#34). Payriff does not sign
    # its callbacks, so this signature is how a webhook proves it belongs to one of our payments.
    # Override per environment; never ship the default.
    webhook-secret: ${MASAPAY_PAYRIFF_WEBHOOK_SECRET:masapay-dev-webhook-secret-change-me-0123456789}
    # Payriff API root (v3 endpoints, as the official SDKs use) and the merchant app key sent as
    # the Authorization header. Supplied per environment.
    base-url: ${MASAPAY_PAYRIFF_BASE_URL:https://api.payriff.com}
    app-key: ${MASAPAY_PAYRIFF_APP_KEY:}
    # Public URL of our webhook endpoint (#35); Payriff posts the payment result here.
    callback-url: ${MASAPAY_PAYRIFF_CALLBACK_URL:http://localhost:8080/api/public/payriff/webhook}
    # Where Payriff sends the customer back after the payment page.
    redirect-url: ${MASAPAY_PAYRIFF_REDIRECT_URL:http://localhost:5173/payment/result}

springdoc:
  # OpenAPI spec and Swagger UI for trying the API by hand. Set MASAPAY_API_DOCS_ENABLED=false
  # in production so the endpoint map is not published.
  api-docs:
    enabled: ${MASAPAY_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${MASAPAY_API_DOCS_ENABLED:true}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
