server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # REST API and WebSocket go to the backend container, so the browser talks to
    # one origin and no CORS setup is needed.
    location /api/ {
        # Menu files (PDF/Word) and dish photos are uploaded; an approved menu import
        # carries its photos in the request too.
        client_max_body_size 25m;
        # Reading a scanned menu with OCR can take a minute or two.
        proxy_read_timeout 180s;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Client-side routes (/r/:slug/t/:id, /admin) are handled by React Router,
    # so unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
