# CI (#51): every pull request and every push to main is built, linted and
# tested before it may be merged. Independent jobs run side by side:
#   rules     - the project's no-emoji rule over every tracked file
#   backend   - Gradle check (unit tests + Testcontainers PostgreSQL tests)
#   frontend  - eslint, stylelint, prettier, type check + build, vitest
#   payriff-e2e - real payments against the Payriff emulator: approve, decline,
#               duplicate and forged callbacks, refunds, outages, the guest's return
#   docker    - both production images build (nothing is pushed)
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rules:
    name: Project rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: No emoji in tracked files
        run: git ls-files -z | xargs -0 node scripts/check-no-emoji.mjs

  backend:
    name: Backend (Gradle check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The runner has Docker, so the Testcontainers PostgreSQL tests run here
      # too (they are skipped on machines without Docker).
      - name: Check
        run: ./gradlew check --no-daemon
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests
          retention-days: 7

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Stylelint
        run: npm run lint:css
      - name: Prettier
        run: npm run format:check
      - name: Tests
        run: npm test
      - name: Type check and build
        run: npm run build

  payriff-e2e:
    name: Payriff end-to-end (emulator)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: masapay
          POSTGRES_USER: masapay
          POSTGRES_PASSWORD: masapay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U masapay -d masapay"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Unofficial Payriff Gateway API v3 emulator, pinned to a known commit.
      # Host networking: its callbacks reach the backend on localhost.
      - name: Start the Payriff emulator
        run: |
          docker build -t payriff-emulator \
            "https://github.com/ismetcahangirov/payriff-emulator.git#aa2148e76727b26bd28e7bd3c303b2f9bfc4e6ab"
          docker run -d --name emulator --network host \
            -e CALLBACK_FIRST_RETRY_MS=2000 -e CALLBACK_RETRY_MS=2000 payriff-emulator
          for i in $(seq 1 30); do curl -fs http://localhost:4010/health && break; sleep 1; done
      - name: Start the backend against the emulator
        working-directory: backend
        env:
          MASAPAY_REDIS_ENABLED: "false"
          MASAPAY_DEV_LOGIN_ENABLED: "true"
          MASAPAY_PAYRIFF_MOCK: "false"
          MASAPAY_PAYRIFF_BASE_URL: http://localhost:4010
          MASAPAY_PAYRIFF_APP_KEY: emulator-secret-key
          MASAPAY_PAYRIFF_CALLBACK_URL: http://localhost:8081/api/public/payriff/webhook
          MASAPAY_RATE_LIMIT_PAYMENT_PER_MINUTE: "1000"
          MASAPAY_RATE_LIMIT_PUBLIC_PER_MINUTE: "1000"
          MASAPAY_RATE_LIMIT_AUTH_PER_MINUTE: "1000"
          SERVER_PORT: "8081"
        run: |
          ./gradlew bootJar -x test --no-daemon -q
          nohup java -jar build/libs/*.jar > ../backend.log 2>&1 &
          # Any HTTP answer means it is up (health is DOWN without Redis, which is off here).
          for i in $(seq 1 90); do curl -s -o /dev/null http://localhost:8081/actuator/health && break; sleep 1; done
      - name: Seed the test data
        env:
          PGPASSWORD: masapay
        run: psql -h localhost -U masapay -d masapay -f scripts/db/2-seed-mock-data.sql -q
      - name: Payment scenarios
        run: node scripts/e2e/payriff-emulator.mjs
      - name: Logs
        if: failure()
        run: |
          tail -200 backend.log
          docker logs emulator | tail -100

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend image
        run: docker build --tag masapay-backend:ci backend
      - name: Frontend image
        run: docker build --tag masapay-frontend:ci frontend
